# The same check the hand-made registry entries carry: the rules load
# and build. A design needs Chisel's generator and Vivado, which a
# presubmit machine does not have.
matrix:
  platform: ["debian11", "ubuntu2204"]
  bazel: ["8.x"]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@rules_firesim//firesim:all"
