name: Tag and Release

# Run by hand. rules_vivado's copy of this also runs on the 5th of each
# month; that is one line to add back once releases here should be cut
# without being asked for.
on:
  workflow_dispatch:

# Pushing the tag, making the release and calling Publish, which asks for
# the same three.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Did anything get committed since the last release? Every job below
  # hangs off the answer.
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags: `git describe` needs both, and the default
          # shallow checkout has neither.
          fetch-depth: 0
      - name: Look for commits since the last release
        id: changes
        run: |
          set -o errexit -o nounset -o pipefail
          latest="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "${latest}" ]; then
            echo "No tag yet; releasing."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "$(git rev-list -n 1 "${latest}")" = "$(git rev-parse HEAD)" ]; then
            echo "HEAD is already released as ${latest}. Nothing to release."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "$(git rev-list --count "${latest}"..HEAD) commit(s) since ${latest}; releasing."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  tag:
    needs: check
    if: ${{ needs.check.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      # A design needs Chisel's generator and Vivado, which a runner does
      # not have, so the check before a release is that both modules
      # resolve against the registries a consumer uses.
      - name: Both modules resolve
        run: |
          set -o errexit -o nounset -o pipefail
          regs="--registry=https://raw.githubusercontent.com/filmil/bazel-registry/main --registry=https://bcr.bazel.build"
          bazel mod graph ${regs} > /dev/null
          (cd chipyard_scala && bazel mod graph ${regs} > /dev/null)
      # The next version from the commits since the last tag: `fix:` or
      # `perf:` a patch, `feat:` a minor, a breaking change a major, and a
      # patch for anything else, since a run of this workflow is a request
      # for a release. Only computed here: the release step below makes
      # the tag, so a tag never exists without its release and its zip.
      - name: Next version
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch
          dry_run: true
      # The same archive the hand-made releases were: `git archive` of the
      # commit, so the tree as committed and nothing else.
      - name: Source archive
        run: |
          set -o errexit -o nounset -o pipefail
          repo="${GITHUB_REPOSITORY#*/}"
          tag="${{ steps.tag_version.outputs.new_tag }}"
          git archive --format=zip -o "${repo}-${tag}.zip" HEAD
          echo "ZIP=${repo}-${tag}.zip" >> "${GITHUB_ENV}"
      - name: Tag and release, with the archive
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          artifacts: ${{ env.ZIP }}

  publish:
    needs: tag
    if: ${{ needs.tag.outputs.tag_name != '' }}
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
