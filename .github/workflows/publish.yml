# Based on the instructions at https://github.com/bazel-contrib/publish-to-bcr
name: "Publish to my Bazel registry"

on:
  workflow_call:
    secrets:
      BCR_PUBLISH_TOKEN:
        required: true
        description: 'A token that can push to filmil/bazel-registry.'
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish"
        required: true
        type: string

jobs:
  publish:
    uses: "bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.0.0"
    with:
      tag_name: ${{ inputs.tag_name }}
      # The registry the pull request is opened against. Not the BCR:
      # rules_firesim depends on modules that are only in this registry
      # (the Chipyard and FireSim overlays under registry/), and a BCR
      # module may depend on BCR modules only.
      registry: filmil/bazel-registry
      # This is the fork of `registry`. It can be the same repo.
      registry_fork: filmil/bazel-registry
      attest: false
      draft: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}

