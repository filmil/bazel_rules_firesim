name: Prebuilt designs

# Builds the standard FireSim designs in integration/ and attaches their
# Golden Gate outputs to a release, so a consumer can fetch them by sha256
# and needs no Scala toolchain. Called by Tag and Release for each new tag;
# can also be run by hand on an existing tag.
on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build and attach the designs to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  rocket_nitefury:
    runs-on: ubuntu-latest
    # A cold build took 62 minutes on half of a workstation; a runner is slower.
    timeout-minutes: 300
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
      # The output base holds the JVM and C++ toolchains and the Maven set;
      # the runner's preinstalled SDKs are removed to make room for it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      # Elaboration, then Golden Gate. No Vivado: the bitstream targets are
      # manual, and the Vivado extension is not evaluated for this one.
      - name: Build the design
        working-directory: integration
        run: bazel build //:rocket_nitefury
      # A reproducible tarball: sorted names, fixed times and owners.
      # goldengate.log is left out, as it holds timings.
      - name: Package
        working-directory: integration
        run: |
          set -o errexit -o nounset -o pipefail
          tag="${{ inputs.tag_name }}"
          name="rocket_nitefury-${tag}"
          out="${GITHUB_WORKSPACE}/${name}"
          mkdir -p "${out}"
          cp bazel-bin/rocket_nitefury/FireSim-generated.* "${out}/"
          chmod 0644 "${out}"/*
          {
            echo "design: rocket_nitefury"
            echo "target_config: firechip.chip:FireSimRocket1GiBDRAMConfig"
            echo "platform_config: firesim.configs:BaseNitefuryConfig"
            echo "rules_firesim: ${tag} (${GITHUB_SHA})"
            echo "files:"
            (cd "${out}" && sha256sum FireSim-generated.* | sed 's/^/  /')
          } > "${out}/PROVENANCE.txt"
          cd "${GITHUB_WORKSPACE}"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf - "${name}" | gzip -n -9 > "${name}.tar.gz"
          sha256sum "${name}.tar.gz" | tee "${name}.tar.gz.sha256"
          echo "TARBALL=${name}.tar.gz" >> "${GITHUB_ENV}"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag_name }}" \
            "${TARBALL}" "${TARBALL}.sha256" --clobber -R "${GITHUB_REPOSITORY}"
